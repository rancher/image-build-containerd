# This workflow triggers on any Dockerfile changes that occur on master.
# 99% of the time, from an UpdateCLI PR merging that bumps the base image.
name: Release on Base Image Update
on:
  push:
    branches:
      - master
    paths:
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Validate base image change is included
        shell: bash
        run: |
          set -euo pipefail

          base_sha="${{ github.event.before }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi

          go_image_changed=false
          for dockerfile in Dockerfile Dockerfile.windows; do
            dockerfile_diff="$(git diff --unified=0 "$base_sha" "$GITHUB_SHA" -- "$dockerfile")"

            if grep -qE '^-ARG GO_IMAGE=' <<< "$dockerfile_diff" && \
              grep -qE '^\+ARG GO_IMAGE=' <<< "$dockerfile_diff"; then
              go_image_changed=true
              echo "Validation passed: GO_IMAGE changed in $dockerfile."
            fi
          done

          if [[ "$go_image_changed" != true ]]; then
            echo "Expected ARG GO_IMAGE= to change in Dockerfile or Dockerfile.windows"
            exit 1
          fi

      - name: "Read Secrets"
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/github/rancher-release-team-auto-tagger/app-credentials appId | APP_ID ;
            secret/data/github/repo/${{ github.repository }}/github/rancher-release-team-auto-tagger/app-credentials privateKey | PRIVATE_KEY

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}

      - name: Republish Latest Release
        uses: rancher/ecm-distro-tools/actions/republish-latest@086cd2f90ed82712e45701441a00e59b95b578c1 # v0.77.1
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          commitish: 'master'
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
